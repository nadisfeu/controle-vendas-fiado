{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao entrar">
  <h1>Controle de Vendas</h1>
  <p class="dica">Digite a senha para entrar.</p>
  {% if erro %}<div class="aviso aviso-erro">{{ erro }}</div>{% endif %}
  <form method="post">
    <label>Senha <input type="password" name="senha" autofocus required></label>
    <button class="botao botao-principal" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
