{% extends "base.html" %}
{% block titulo %}Editar {{ p.nome }}{% endblock %}
{% block conteudo %}
<a class="voltar" href="{{ url_for('produto_ver', produto_id=p.id) }}">← {{ p.nome }}</a>
<h1>Editar produto</h1>
<form method="post" class="cartao formulario">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label><span>Tipo <small>(opcional, ex.: Perfume)</small></span>
    <input name="tipo" list="lista-tipos" autocomplete="off" value="{{ form.get('tipo', p.tipo) }}"></label>
  <label><span>Marca <small>(opcional, ex.: Natura)</small></span>
    <input name="marca" list="lista-marcas" autocomplete="off" value="{{ form.get('marca', p.marca) }}"></label>
  <label>Nome <input name="nome" required value="{{ form.get('nome', p.nome) }}"></label>
  <label><span>Código <small>(opcional; não pode repetir)</small></span>
    <input name="codigo" autocomplete="off" value="{{ form.get('codigo', p.codigo or '') }}"></label>
  <datalist id="lista-marcas">{% for m in marcas %}<option value="{{ m }}">{% endfor %}</datalist>
  <datalist id="lista-tipos">{% for x in tipos %}<option value="{{ x }}">{% endfor %}</datalist>
  <label>Preço <input name="preco" inputmode="decimal" required value="{{ form.get('preco', p.preco|campo) }}">
    <small>O novo preço vale só para as próximas vendas.</small></label>
  <label><span>Chegou mercadoria? Quantas unidades somar</span>
    <input name="entrada" inputmode="numeric" placeholder="ex.: 12" value="{{ form.get('entrada', '') }}">
    <small>Soma ao estoque atual ({{ p.estoque }}). Deixe vazio se não chegou nada.</small></label>
  <label>Quantidade em estoque agora
    <input name="estoque" inputmode="numeric" value="{{ form.get('estoque', p.estoque) }}">
    <small>Só mude aqui para corrigir depois de contar o que tem. Para mercadoria nova, use o campo de cima.
    Negativo = vendeu mais do que tinha.</small></label>
  <label class="check">
    <input type="checkbox" name="ativo" value="1" {{ 'checked' if (form.get('ativo') == '1' if form else p.ativo) }}>
    Ativo <small>(desmarque para tirar da tela de venda)</small>
  </label>
  <button class="botao botao-principal" type="submit">Salvar</button>
</form>
{% endblock %}
